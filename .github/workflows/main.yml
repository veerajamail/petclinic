name: Petclinic CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    name: Build & Sonar
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Maven
        uses: s4u/setup-maven-action@v1
        with:
          maven-version: '3.8.8'

      - name: Build and Unit Test
        run: |
          mvn clean compile
          mvn test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=Petclinic
            -Dsonar.projectName=Petclinic
            -Dsonar.java.binaries=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          timeout: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@v1.0.0
        with:
          project: 'Petclinic'
          scanPath: '.'
          format: 'HTML'

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: '**/dependency-check-report.html'

      - name: Docker Login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Docker Build & Push
        run: |
          docker build -t petclinic1 .
          docker tag petclinic1 sevenajay/petclinic1:latest
          docker push sevenajay/petclinic1:latest

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sevenajay/petclinic1:latest
          format: 'table'
          output: trivy.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy.txt


  deploy:
    name: Deploy to Environments
    runs-on: ubuntu-latest
    needs: security
    environment:
      name: production     # 🔐 Manual approval set in GitHub UI
      url: https://your-app.example.com

    steps:
      - uses: actions/checkout@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Tomcat
        run: |
          sudo cp target/petclinic.war /opt/apache-tomcat-9.0.65/webapps/

      - name: Clean and Run Docker Locally
        run: |
          docker stop pet1 || true
          docker rm pet1 || true
          docker run -d --name pet1 -p 8082:8080 sevenajay/petclinic1:latest

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI/CD Notification - ${{ github.job }}"
          to: postbox.aj99@gmail.com
          from: GitHub Actions <postbox.aj99@gmail.com>
          content_type: text/html
          body: |
            <p><b>Workflow Complete:</b> Petclinic Deployment</p>
            <p>Workflow Run: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View</a></p>
