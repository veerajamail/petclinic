apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-otelcol
  labels:
    app.kubernetes.io/name: otelcol
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/version: "0.82.0"
data:
  relay: |
    connectors:
      spanmetrics: null
    exporters:
      logging: {}
      otlp:
        endpoint: opentelemetry-demo-otelcol.default.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        enable_open_metrics: true
        endpoint: 0.0.0.0:8888
        resource_to_telemetry_conversion:
          enabled: true
      jaeger:
        endpoint: opentelemetry-demo-jaeger.default.svc.cluster.local:14250
        tls:
          insecure: true
    extensions:
      health_check:
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env.MY_POD_IP}:4317
          http:
            endpoint: ${env.MY_POD_IP}:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_http:
            endpoint: 0.0.0.0:14268
      prometheus:
        config:
          scrape_configs:
            - job_name: opentelemetry-collector
              scrape_interval: 10s
              static_configs:
                - targets:
                    - 0.0.0.0:8888
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['${env.MY_POD_IP}:8888']
            - job_name: 'node-exporter'
              scrape_interval: 10s
              static_configs:
                - targets: ['${env.MY_POD_IP}:9100']
            - job_name: 'petclinic_otel'
              scrape_interval: 10s
              static_configs:
                - targets: ['${env.MY_POD_IP}:8080']
              metrics_path: /actuator/prometheus

    processors:
      batch: {}
      filter/ottl:
        error_mode: ignore
        metrics:
          metric:
            - name == "rpc.server.duration"
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - action: insert
            from_attribute: k8s.pod.uid
            key: service.instance.id
      transform:
        metric_statements:
          - context: metric
            statements:
              - set(description, "") where name == "queueSize"
              - set(description, "") where name == "rpc.server.duration"
              - set(description, "") where name == "http.client.duration"

    service:
      extensions:
        - health_check
        - pprof
        - zpages
      pipelines:
        logs:
          exporters:
            - logging
          processors:
            - k8sattributes
            - memory_limiter
            - batch
          receivers:
            - otlp
        metrics:
          exporters:
            - prometheus
            - logging
          processors:
            - k8sattributes
            - memory_limiter
            - filter/ottl
            - transform
            - resource
            - batch
          receivers:
            - otlp
            - spanmetrics
            - prometheus
        traces:
          exporters:
            - otlp
            - jaeger
            - logging
            - spanmetrics
          processors:
            - k8sattributes
            - memory_limiter
            - resource
            - batch
          receivers:
            - otlp
            - jaeger
      telemetry:
        metrics:
          address: ${env.MY_POD_IP}:8889

